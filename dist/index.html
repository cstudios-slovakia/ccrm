    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet" />
    <!--
      Paint the right theme before the first frame.

      React decides the theme in src/utils/theme.ts, but it only runs after the
      bundle has parsed. Without this the app flashes a full white screen at
      every dark-mode boot, which is the one thing dark mode exists to avoid.
      This mirrors resolveAppearance() for the three cheap modes; `auto` needs
      sunrise/sunset, so it reads the answer the last run cached and the real
      calculation corrects it on mount.
    -->
    <script>
      (function () {
        try {
          var read = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
          var mode = read("ccrm_theme_mode") || "system";
          var palette = read("crm_user_theme") || "basic";
          var dark =
            mode === "dark" ? true :
            mode === "light" ? false :
            mode === "auto" ? read("ccrm_theme_auto_dark") === "1" :
            !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.setAttribute("data-theme", dark ? "dark" : palette);
          root.setAttribute("data-appearance", dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-Ciu1P_q9.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cv8wMBEf.css">
  </head>
  <body class="font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    
    <!-- Active Service Worker Unregistration to prevent caching issues -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister().then((success) => {
              if (success) {
                console.log("Service Worker successfully unregistered");
                if ("caches" in window) {
                  caches.keys().then((names) => {
                    for (let name of names) caches.delete(name);
                  });
                }
              }
            });
          }
        });
      }
    </script>
  </body>
