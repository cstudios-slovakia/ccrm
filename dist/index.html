            if (metaApp) metaApp.setAttribute("content", sysName);

          var palette = read("crm_user_theme") || "basic";
          var isRadical = palette === "paper" || palette === "minimalist" || palette === "retro";

          root.style.colorScheme = dark ? "dark" : "light";
          // View size — mirrors resolveViewSize() in src/utils/viewSize.ts.
          var VS_DEFAULT = "auto"; // keep equal to viewSize.ts (unit-tested)
          var vs = read("ccrm_view_size");
          var vsMode = vs === "auto" || vs === "compact" || vs === "normal" || vs === "big" ? vs : VS_DEFAULT;
          var mq = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
