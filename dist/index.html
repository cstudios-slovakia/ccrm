    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet" />
    <!--
      Paint the right theme before the first frame.

      React decides the theme in src/utils/theme.ts, but it only runs after the
      bundle has parsed. Without this the app flashes a full white screen at
      every dark-mode boot, which is the one thing dark mode exists to avoid.
      This mirrors resolveAppearance() for the three cheap modes; `auto` needs
      sunrise/sunset, so it reads the answer the last run cached and the real
      calculation corrects it on mount.
    -->
    <script>
      (function () {
        try {
          var read = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
          var sysName = read("crm_system_name");
          if (sysName) {
            var metaApple = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (metaApple) metaApple.setAttribute("content", sysName);
            var metaApp = document.querySelector('meta[name="application-name"]');
            if (metaApp) metaApp.setAttribute("content", sysName);
          }
          var mode = read("ccrm_theme_mode") || "system";
          var palette = read("crm_user_theme") || "basic";
          var dark =
            mode === "dark" ? true :
            mode === "light" ? false :
            mode === "auto" ? read("ccrm_theme_auto_dark") === "1" :
            !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.setAttribute("data-theme", dark ? "dark" : palette);
          root.setAttribute("data-appearance", dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
          // View size — mirrors resolveViewSize() in src/utils/viewSize.ts.
          var VS_DEFAULT = "auto"; // keep equal to viewSize.ts (unit-tested)
          var vs = read("ccrm_view_size");
          var vsMode = vs === "auto" || vs === "compact" || vs === "normal" || vs === "big" ? vs : VS_DEFAULT;
          var mq = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
          var vsSize = vsMode !== "auto" ? vsMode
            : mq("(min-width: 2200px)") ? "big" : mq("(min-width: 1800px)") ? "normal" : "compact";
          root.setAttribute("data-view-size", vsSize);
          root.setAttribute("data-view-size-mode", vsMode);
        } catch (e) {}
      })();
    </script>
    <!-- Chart.js: window.Chart is read directly by ClientsView's financial report
         charts and DynamicDashboardView's AI-generated chart widgets. There is no
         bundled/npm chart library, so removing this (as a prior cleanup did) makes
         every chart on both silently no-op with a console warning. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" crossorigin src="./assets/index-D9y3PP8a.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D4CHeXVc.css">
  </head>
  <body class="font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    
    <!-- Service Worker registration for PWA mobile & desktop push notifications -->
    <script>
      if ("serviceWorker" in navigator && !window.location.search.includes("qa=")) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js", { scope: "/" })
            .then(function (reg) {
              console.log("[CCRM SW] Registered successfully:", reg.scope);
            })
            .catch(function (err) {
              console.warn("[CCRM SW] Registration failed:", err);
            });
        });
      }
    </script>
  </body>
