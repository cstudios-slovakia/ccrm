<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCRM Tasks</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --surface: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 780px;
      height: 600px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Extension Toolbar */
    .extension-header {
      height: 44px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px rgba(79, 70, 229, 0.6);
    }

    .brand-title {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .brand-pill {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      background: #eef2ff;
      color: #4f46e5;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }

    .actions-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      background: #f1f5f9;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      color: #ffffff;
    }

    /* Main Frame Area */
    .frame-container {
      flex: 1;
      position: relative;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }

    /* Settings Overlay Modal */
    .settings-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .settings-modal.active {
      display: flex;
    }

    .settings-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 440px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-card h3 {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-card label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .settings-card input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .settings-card input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }

    .presets-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      background: #f1f5f9;
      color: var(--text-muted);
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-pill:hover {
      background: #e2e8f0;
      color: var(--text);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    /* Offline / Error State */
    .offline-banner {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      gap: 12px;
      z-index: 50;
    }

    .offline-banner.active {
      display: flex;
    }

    .offline-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #fef2f2;
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .offline-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
    }

    .offline-desc {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 360px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <!-- Header Bar -->
  <header class="extension-header">
    <div class="brand-section">
      <div class="brand-dot"></div>
      <span class="brand-title">CCRM</span>
      <span class="brand-pill">Tasks</span>
    </div>
    <div class="actions-section">
      <button id="btnSidePanel" class="btn-icon" title="Open docked in Chrome Side Panel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
        <span>Side Panel</span>
      </button>
      <button id="btnOpenTab" class="btn-icon" title="Open full CCRM in new tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
      <button id="btnReload" class="btn-icon" title="Reload tasks">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
      </button>
      <button id="btnSettings" class="btn-icon" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Iframe Container -->
  <main class="frame-container">
    <iframe
      id="tasksIframe"
      allow="microphone; camera; clipboard-read; clipboard-write; display-capture"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
    ></iframe>

    <!-- Offline / Error State -->
    <div id="offlineState" class="offline-banner">
      <div class="offline-icon">⚠</div>
      <h2 class="offline-title">Cannot connect to CCRM</h2>
      <p class="offline-desc" id="offlineDesc">
        Make sure your CCRM application server is running and accessible.
      </p>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button id="btnRetry" class="btn-icon btn-primary">Try Again</button>
        <button id="btnConfigure" class="btn-icon">Configure URL</button>
      </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settingsModal" class="settings-modal">
      <div class="settings-card">
        <h3>
          <span>CCRM Connection Settings</span>
          <button id="btnCloseSettings" class="btn-icon" style="padding:2px 6px;">✕</button>
        </h3>
        <div>
          <label for="urlInput">CCRM Base URL</label>
          <input type="text" id="urlInput" placeholder="http://localhost:5173" style="margin-top:6px;">
        </div>
        <div>
          <label style="margin-bottom:6px; display:block;">Quick Presets</label>
          <div class="presets-row">
            <button class="preset-pill" data-url="http://localhost:5173">localhost:5173</button>
            <button class="preset-pill" data-url="http://localhost:3000">localhost:3000</button>
            <button class="preset-pill" data-url="http://localhost:8080">localhost:8080</button>
          </div>
        </div>
        <div class="modal-actions">
          <button id="btnCancelSettings" class="btn-icon">Cancel</button>
          <button id="btnSaveSettings" class="btn-icon btn-primary">Save & Connect</button>
        </div>
      </div>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
