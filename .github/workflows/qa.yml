name: QA

# Runs the same npm scripts a developer runs locally, so a red build always
# reproduces with one command on your machine:
#
#   npm run test:unit
#   node scripts/qa/run-qa.mjs --files <files you changed>
#
# Shape:   plan  -> qa (matrix of shards, in parallel) -> report
#          checks (audit, type-checks, unit tests; runs alongside plan/qa)
#
# `plan` picks the scope and the shard count: a run of more than 80 tests is split in four
# (--shard=i/4), a small one stays a single shard. `report` merges the shards' blob reports
# and applies the known-failing register once, on the merged result. Scoped runs leave the
# autonomous crawler ("Deep UI audit") out; --full, the nightly and a harness change
# include it. No secrets, no database, no PHP: the QA suite mocks /sync.php, /api/* and
# /upload.php and seeds its own dataset. See docs/TESTING.md, section 8.

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the whole suite including the slow crawler, sharded, on each branch in
  # NIGHTLY_REFS (scripts/qa/ci-plan.mjs). GitHub fires a schedule only from the DEFAULT
  # branch's copy of this file, so the nightly starts once this workflow is on main.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      files:
        description: "Run only these spec files (space separated), e.g. tests/e2e/projectFiles.spec.ts. Empty = the whole suite."
        required: false
        default: ""

# A newer push to the same branch supersedes an in-flight run. The group includes the
# event, so a push never cancels the nightly (and the nightly is never cancelled at all).
concurrency:
  group: qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      refs: ${{ steps.plan.outputs.refs }}
      shards: ${{ steps.plan.outputs.shards }}
      args: ${{ steps.plan.outputs.args }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Scope by event: a PR is tested against its base branch, a push against the commit
      # before it. Unknown history (first push, force-push), manual runs and the nightly
      # get the whole suite. Values arrive through env, never inlined.
      - name: Choose scope and shards
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          FILES: ${{ github.event.inputs.files }}
        run: node scripts/qa/ci-plan.mjs

      - name: Plan on the run summary
        env:
          COUNT: ${{ steps.plan.outputs.count }}
          SHARDS: ${{ steps.plan.outputs.shards }}
          ARGS: ${{ steps.plan.outputs.args }}
        run: |
          {
            echo "## QA plan"
            echo
            echo "- scope: \`run-qa.mjs $ARGS\`"
            echo "- tests: $COUNT (-1 = whole suite, not counted)"
            echo "- shards: $SHARDS"
          } >> "$GITHUB_STEP_SUMMARY"

  # Everything that is not a browser test, once per ref (two refs only in the nightly).
  checks:
    name: Checks (${{ matrix.ref || 'this ref' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["main","1.13-nectarine"]' || '[""]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fails the build when a dependency has a known high/critical advisory, so the
      # lockfile cannot quietly drift back to a vulnerable version.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type-check the app
        run: npx tsc -b

      - name: Type-check the QA suite
        run: npm run test:qa:typecheck

      - name: Unit tests
        run: npm run test:unit

  qa:
    name: QA ${{ matrix.label }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Each shard runs its slice and keeps a blob; the verdict comes from the report job.
      # A shard fails here only when the run could not happen (exit 2/3, crash); failing
      # tests (exit 1) are judged after the merge, against the known-failing register.
      - name: QA audit (shard ${{ matrix.shard }}/${{ matrix.shards }})
        env:
          ARGS: ${{ matrix.args }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          CI: "1"
          QA_BLOB: "1"
          # A runner is dedicated to this job, so the desktop-friendly CPU cap and
          # the two-worker ceiling in run-qa.mjs only slow it down.
          QA_WORKERS: 3
          QA_MAX_CORES: 0
          # A hung test fails after 2.5 min instead of 4, so a few hangs cannot use up
          # the run limit. The module crawls set their own, longer limit.
          QA_TEST_TIMEOUT_MS: 150000
          QA_GLOBAL_TIMEOUT_MS: 3000000
          # One retry: a test that passes on the second try is reported as flaky and does not
          # block; a real failure fails twice. Flaky tests are listed in the run summary.
          QA_RETRIES: 1
        run: |
          shard_flag=""
          if [ "$SHARDS" -gt 1 ]; then shard_flag="--shard=$SHARD/$SHARDS"; fi
          set +e
          # Word splitting is the point: ARGS is a flag list and file paths.
          node scripts/qa/run-qa.mjs $ARGS -- $shard_flag
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi

      # Uploaded even when the audit fails - that is exactly when you need them.
      # Each run folder is self-contained (report.md + findings.json +
      # screenshots/), so the downloaded artifact renders with its evidence.
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ matrix.label }}-shard-${{ matrix.shard }}
          path: |
            test-results/runs/
            test-results/qa-audit-report.md
          retention-days: 14
          if-no-files-found: warn

      - name: Upload shard blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-blob-${{ matrix.label }}-${{ matrix.shard }}
          path: blob-report/
          # Only the Verdict job of this same run reads them (~380 MB per full run).
          retention-days: 1
          if-no-files-found: warn

  report:
    name: Verdict (${{ matrix.ref || 'this ref' }})
    needs: [plan, checks, qa]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Gate on the other jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          QA: ${{ needs.qa.result }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          echo "checks=$CHECKS qa=$QA count=$COUNT"
          if [ "$CHECKS" != "success" ]; then
            echo "::error::Static checks (audit, type-check, unit tests) did not pass."
            echo "- **Static checks failed.** See the Checks job." >> "$GITHUB_STEP_SUMMARY"
            echo "failed=1" >> "$GITHUB_ENV"
          fi
          if [ "$COUNT" = "0" ]; then
            echo "Nothing changed that the suite covers, so no browser test ran." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$QA" != "success" ]; then
            echo "::error::A QA shard could not run (see the QA jobs)."
            echo "- **A QA shard did not complete.** See the QA jobs." >> "$GITHUB_STEP_SUMMARY"
            echo "failed=1" >> "$GITHUB_ENV"
          fi

      - name: Download shard blobs
        if: needs.plan.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: qa-blob-${{ matrix.ref && matrix.ref || 'run' }}-*
          path: all-blobs
          merge-multiple: true

      - name: Download shard reports
        if: needs.plan.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: qa-report-${{ matrix.ref && matrix.ref || 'run' }}-shard-*
          path: shard-reports

      # One JSON and one HTML report for the whole run; the register is applied once, here.
      - name: Merge shard reports and apply the known-failing register
        if: needs.plan.outputs.count != '0'
        run: |
          mkdir -p test-results
          if ls all-blobs/*.zip >/dev/null 2>&1; then
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/qa-results.json npx playwright merge-reports --reporter=json all-blobs
            PLAYWRIGHT_HTML_OPEN=never npx playwright merge-reports --reporter=html all-blobs || true
          else
            echo "::error::No shard produced a blob report."
            echo "failed=1" >> "$GITHUB_ENV"
          fi
          set +e
          node scripts/qa/apply-known-failing.mjs "${failed:-0}"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then echo "failed=1" >> "$GITHUB_ENV"; fi

      # Only when the verdict is red: the merged HTML report carries every failure's trace and
      # measured 385 MB on a full run, mostly for failures the register already accepts.
      - name: Upload merged Playwright report
        if: always() && needs.plan.outputs.count != '0' && env.failed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.ref && matrix.ref || 'run' }}
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore

      # Puts every shard's verdict on the workflow summary page, so the result is readable
      # in the browser without downloading anything.
      - name: Publish shard reports to the run summary
        if: always() && needs.plan.outputs.count != '0'
        env:
          REF: ${{ matrix.ref || 'this ref' }}
        shell: bash
        run: |
          {
            echo "## CCRM QA audit ($REF)"
            echo
            found=0
            for report in $(ls shard-reports/*/test-results/qa-audit-report.md 2>/dev/null | sort); do
              found=1
              echo "### $(basename "$(dirname "$(dirname "$report")")")"
              echo
              # Everything up to the per-defect detail: verdict + summary table.
              sed -n '1,/^## Defect detail/p' "$report" | sed '$d'
              echo
            done
            if [ "$found" = 0 ]; then echo "No QA report was produced."; fi
            echo "_Full reports, findings JSON and screenshots are in the \`qa-report-*\` artifacts._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final verdict
        if: always()
        run: |
          if [ "${failed:-0}" = "1" ]; then echo "QA: failing."; exit 1; fi
          echo "QA: passing."
