# Apache settings for the CCRM container, which sits behind Caddy.

ServerName localhost

<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# --- Behind a reverse proxy -------------------------------------------------
# Caddy is the only thing that can reach this container, over the compose
# network. Trust X-Forwarded-For from that network only, so REMOTE_ADDR is the
# real visitor: login throttling (20 failures / 15 min per IP) would otherwise
# lock out every user behind one proxy address at once.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16

# api/auth.php sets the session cookie's Secure flag from $_SERVER['HTTPS'] only,
# which is empty when TLS ends at Caddy. Derive it from the proxy header.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# --- PHP limits that the repo's own .htaccess would otherwise lower ---------
# .htaccess sets upload_max_filesize 64M / post_max_size 80M via php_value
# (mod_php). php_admin_value cannot be overridden by .htaccess, so these win and
# match the hosting spec (128M uploads).
php_admin_value upload_max_filesize 128M
php_admin_value post_max_size 140M

# Caddy already logs requests; keep the container log for PHP errors only.
CustomLog /dev/null common
ErrorLog /proc/self/fd/2
