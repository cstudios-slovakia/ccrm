; Values from docs/CCRM_Hosting_Server_Specifications.pdf (section 4).
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 140M
max_execution_time = 180
max_file_uploads = 50
date.timezone = UTC          ; config.php sets Europe/Bratislava itself
expose_php = Off
display_errors = Off
log_errors = On
session.cookie_httponly = 1

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; Files change only through `php ccrm update`, which update.sh follows with a
; graceful Apache restart; a 2 s revalidate keeps a manual hotfix visible anyway.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.jit = tracing
opcache.jit_buffer_size = 128M
